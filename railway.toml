# Railway конфігурація
# seed.py запускається автоматично перед стартом бота

[build]
builder = "NIXPACKS"

[deploy]
# Спочатку seed (завантаження контенту в БД), потім бот
startCommand = "python content/seed.py && python bot.py"

# Перезапускати тільки якщо бот впав (не seed)
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

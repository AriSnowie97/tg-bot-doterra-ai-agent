# Railway configuration
# seed.py runs automatically before the bot starts

[build]
builder = "NIXPACKS"

[deploy]
# First syncs content, then runs and supervises bot, web app and helper bots
startCommand = "python supervisor.py"
healthcheckPath = "/health"
healthcheckTimeout = 100

# Restart only if the bot crashes (not seed)
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

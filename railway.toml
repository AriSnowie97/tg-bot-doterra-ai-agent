# Railway configuration
# seed.py runs automatically before the bot starts

[build]
builder = "NIXPACKS"

[deploy]
# First seed (loading content to the database), then bot
startCommand = "python src/content/seed.py && python manualWork.py && uvicorn src.web.app:app --host 0.0.0.0 --port 8000 & python kb_bot.py & python bot.py"

# Restart only if the bot crashes (not seed)
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

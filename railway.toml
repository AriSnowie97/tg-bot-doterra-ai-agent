# Railway configuration
# seed.py runs automatically before the bot starts

[build]
builder = "NIXPACKS"

[deploy]
# First seed (loading content to the database), then bot
startCommand = "python src/content/seed.py && python manualWork.py && python bot.py"

# Restart only if the bot crashes (not seed)
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
